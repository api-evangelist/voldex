name: Voldex
description: >-
  Voldex (Voldex Entertainment) is a game developer and publisher founded in
  2015 that acquires, operates, and grows platform-leading games on Roblox,
  including Brookhaven, Driving Empire, and NFL Universe Football, collectively
  reaching over 140 million monthly players. Its stated mission is to "bring
  people together through fun," pursuing a focused strategy of selectively
  acquiring and stewarding enduring Roblox experiences rather than broad
  portfolio expansion. Voldex publishes no public developer API, SDK, CLI, or
  API documentation surface — it is a consumer games studio whose products run
  inside the Roblox platform. This profile is maintained in the API Evangelist
  network as an a16z portfolio company; it was reviewed by the enrichment
  pipeline and confirmed to have no API surface to catalog.
